<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your scratchie · Adelaide Whip</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/cylinder-sticker.png">
<link rel="preload" as="image" href="/wordmark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--cream:#FAF6EC;--sky-soft:#E8F4FA;--sky-mid:#D5EAF5;--ink:#1C1C1C;--ink-soft:#4A4744;--warm-grey:#8C857C;--blue:#1A8FBF;--pink:#E07594;--yellow:#FFD166;--cyan:#2BC0FF;--line:rgba(28,28,28,.08)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:radial-gradient(120% 60% at 50% -10%,rgba(43,192,255,.55) 0%,rgba(43,192,255,0) 60%),radial-gradient(90% 40% at 100% 100%,rgba(255,209,102,.45) 0%,rgba(255,209,102,0) 60%),radial-gradient(70% 35% at 0% 95%,rgba(224,117,148,.22) 0%,rgba(224,117,148,0) 60%),linear-gradient(180deg,#9FD9F7 0%,#C9E8F8 40%,#FBF1DA 100%) fixed;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:26px 18px 48px;overflow-x:hidden}
  .logo{height:54px;width:auto;margin:4px 0 16px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(28px,7vw,36px);line-height:1.08;margin:0 0 8px;text-align:center;letter-spacing:-.01em;text-wrap:balance}
  .lede{margin:0 0 18px;color:var(--ink-soft);font-size:15px;text-align:center;max-width:36ch;min-height:1.4em}
  .step{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);text-align:center;margin:0 0 10px}
  /* stage = untransformed box the card sits in; card = the 3D tilting object (white border included) */
  .stage{width:min(340px,100%);perspective:900px}
  .card{position:relative;width:100%;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(26,143,191,.16),0 1px 0 var(--line);padding:12px;user-select:none;-webkit-user-select:none;transform-style:preserve-3d;will-change:transform,box-shadow;transform-origin:50% 50% 0}
  .shade{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5}
  .rule{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warm-grey)}
  .rule b{color:var(--pink)}
  .gridwrap{position:relative;touch-action:none;border-radius:16px;overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#C9E3F2;border-radius:16px}
  .cell{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#F7FBFE 0%,#DDEEF8 100%);box-shadow:0 1px 0 #fff inset,0 3px 8px rgba(26,143,191,.14);display:flex;align-items:center;justify-content:center;padding:4px;line-height:1;position:relative;transition:box-shadow .25s}
  /* prize tiles: full-colour gradients with a gloss; each carries its own ring colour (--c) and shadow (--sh) */
  .cell.hue{overflow:hidden;box-shadow:0 0 0 2.5px #fff inset,0 3px 8px var(--sh)}
  .cell.hue::before{content:"";position:absolute;inset:2.5px 2.5px auto 2.5px;height:42%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
  .cell.hue .tile b{color:#fff;text-shadow:0 1px 0 rgba(0,40,70,.18)}
  .cell.hue .tile svg,.cell.hue .tile img{filter:drop-shadow(0 2px 2px rgba(0,40,70,.28))}
  .cell.hue .tile{position:relative}
  .cell.pct{--c:#E07594;--sh:rgba(224,117,148,.38);background:linear-gradient(180deg,#EC90AB 0%,#D9648A 100%)}
  .cell.c-del{--c:#1A8FBF;--sh:rgba(26,143,191,.38);background:linear-gradient(180deg,#4DBCF9 0%,#1E96CC 100%)}
  .cell.c-five{--c:#F2B33D;--sh:rgba(242,179,61,.42);background:linear-gradient(180deg,#FFD871 0%,#F5B53A 100%)}
  .cell.c-five .tile b{color:#5B4300;text-shadow:none}
  .cell.c-cyl{--c:#2BB5A8;--sh:rgba(43,181,168,.4);background:linear-gradient(180deg,#5FD6C9 0%,#2AB0A3 100%)}
  .cell.pct .num{position:relative;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.01em;color:#fff;line-height:1;text-align:center}
  .cell.pct .num small{display:block;font:700 10px Inter,sans-serif;letter-spacing:.16em;margin-top:3px;opacity:.92}
  .cell .tile{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cell .tile svg{width:44px;height:44px;display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(26,143,191,.28))}
  .cell .tile svg .under *{fill:#fff;stroke:#fff;stroke-width:4.6;stroke-linejoin:round;stroke-linecap:round;paint-order:stroke}
  .cell .tile svg .under .txt{display:none}
  .cell .tile svg .over .body{fill:#3AB0F8;stroke:#1090E0;stroke-width:1.4;stroke-linejoin:round}
  .cell .tile svg .over .detail,.cell .tile svg .over .hole{fill:#fff;stroke:#1090E0;stroke-width:1}
  .cell .tile svg .over .wheel{fill:#1090E0}
  .cell .tile svg .over .hub{fill:#fff}
  .cell .tile svg .over .txt{fill:#fff;font:800 8.8px Inter,sans-serif;letter-spacing:-.02em}
  .cell .tile svg .over .accent{fill:none;stroke:var(--pink);stroke-width:1.8;stroke-linecap:round}
  .cell .tile svg .over .dim{fill:#E6ECF1;stroke:var(--warm-grey)}
  .cell .tile svg .over .x{fill:none;stroke:var(--warm-grey);stroke-width:1.8;stroke-linecap:round}
  .cell .tile img{height:58px;width:auto;display:block;filter:drop-shadow(0 2px 2px rgba(26,143,191,.28))}
  .cell .tile b{font:700 9.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--warm-grey);text-align:center;line-height:1.15}
  .cell.win{box-shadow:0 0 0 2.5px #fff inset,0 0 0 3px var(--c,var(--pink)),0 3px 10px var(--sh,rgba(26,143,191,.2))}
  .cell.win .tile{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
  .cell.pct.win .num{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
  canvas.foil{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.foil.gone{pointer-events:none;opacity:0;transition:opacity .35s}
  .start{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);appearance:none;border:0;background:var(--ink);color:#fff;font:600 13.5px Inter,sans-serif;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 8px 24px rgba(0,20,40,.35);animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
  .result{margin:12px 0 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
  .result .big{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;line-height:1.1}
  .result .big.pink{color:var(--pink);font-size:30px}
  .result .sm{color:var(--ink-soft);font-size:13.5px;max-width:30ch}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:min(340px,100%)}
  .btn{appearance:none;border:0;border-radius:14px;height:50px;font:600 15px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s ease,background .2s}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#177fa9}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 6px 18px rgba(28,28,28,.06)}
  .btn.pink{background:var(--pink);color:#fff}
  .btn.small{height:40px;font-size:13.5px}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .hidden{display:none!important}
  .dbg{margin:10px 0 0;font:500 11px ui-monospace,Menlo,monospace;color:var(--ink-soft);background:rgba(255,255,255,.7);border-radius:8px;padding:6px 10px;text-align:center;line-height:1.5;max-width:min(340px,100%)}
  .tiltbtn{appearance:none;border:0;background:rgba(255,255,255,.72);color:var(--blue);font:600 12.5px Inter,sans-serif;border-radius:999px;padding:9px 16px;margin-top:14px;cursor:pointer;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(26,143,191,.12);max-width:min(340px,100%);text-align:center;line-height:1.35}
  .code{margin-top:2px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(28,28,28,.06)}
  .code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.14em}
  .code button{appearance:none;border:0;background:var(--sky-soft);color:var(--blue);font:600 13px Inter,sans-serif;border-radius:10px;padding:9px 12px;cursor:pointer}
  .fine{margin:16px 0 0;font-size:12px;color:var(--warm-grey);text-align:center;max-width:40ch;line-height:1.45}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .pop{animation:pop .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .shake{animation:shake .35s ease-in-out}
  @media (prefers-reduced-motion:reduce){.pop,.shake,.cell.win .tile,.cell.pct.win .num,.start{animation:none}canvas.foil.gone{transition:none}}
</style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="Adelaide Whip">
  <h1 id="title">Your scratchie's here.</h1>
  <p class="lede" id="lede">Scratch the panels. Match three the same to win.</p>

  <p class="step" id="step">Card 1 of 3</p>
  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="rule"><span>Match 3</span><span>Win <b id="prize">10% off</b></span></div>
      <div class="gridwrap" id="gridwrap">
        <div class="grid" id="grid"></div>
        <canvas class="foil" id="foil" aria-label="Scratch the panels" role="img"></canvas>
        <button class="start hidden" id="start">Tap to start</button>
      </div>
      <div class="result" id="result"><div class="sm">Use a finger or your mouse.</div></div>
      <div class="shade" id="shade"></div>
    </div>
  </div>
  <button class="tiltbtn hidden" id="tiltBtn">Turn on tilt</button>
  <p class="dbg hidden" id="dbg"></p>

  <div class="actions" id="actions">
    <button class="btn ghost small hidden" id="revealAll">Reveal the rest</button>
    <button class="btn primary hidden" id="next">Next card</button>
    <button class="btn pink hidden" id="double">Double down or nothing</button>
    <button class="btn ghost hidden" id="keep">I'll keep my 10%</button>
    <div class="code hidden" id="codeBox"><b id="codeText">SCRATCH10</b><button id="copy">Copy</button></div>
    <a class="btn primary hidden" id="shop" href="#">Shop with 10% off</a>
  </div>
  <p class="fine hidden" id="fine"></p>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var CODE = (q.get('code') || 'SCRATCH10').toUpperCase().replace(/[^A-Z0-9]/g,'');
  var EXP  = q.get('exp') || '';
  var NAME = (q.get('n') || '').replace(/[^A-Za-z' -]/g,'').trim();
  var SHOP = 'https://www.adelaidewhip.com/discount/' + encodeURIComponent(CODE) + '?redirect=%2Fcollections%2Fall';
  if (NAME) document.getElementById('title').textContent = NAME + ', your scratchie’s here.';

  var $ = function(id){return document.getElementById(id)};
  var grid=$('grid'), wrap=$('gridwrap'), foil=$('foil'), result=$('result'), step=$('step'), lede=$('lede'), prize=$('prize');
  var stage=$('stage'), card=$('card'), shade=$('shade');
  var B={revealAll:$('revealAll'),next:$('next'),dbl:$('double'),keep:$('keep'),codeBox:$('codeBox'),codeText:$('codeText'),copy:$('copy'),shop:$('shop'),fine:$('fine')};
  function show(){for(var i=0;i<arguments.length;i++)arguments[i].classList.remove('hidden')}
  function hide(){for(var i=0;i<arguments.length;i++)arguments[i].classList.add('hidden')}
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CAN_HOVER = window.matchMedia && matchMedia('(hover: hover)').matches;

  // ── Scripted cards. Symbol POSITIONS are shuffled per visit; the OUTCOME is fixed
  //    (no three-of-a-kind → three 10% → two cylinders and a miss). The last screen says so.
  // Prize tiles a real card would show (four prizes + a blank). Only 10% ever completes a triple.
  var ICO = {
    van:   '<path class="body" d="M4 8.2a1.7 1.7 0 0 1 1.7-1.7H15v10H4z"/><path class="body" d="M15 10h3.3a1.2 1.2 0 0 1 .9.4l2.7 3.2c.2.2.3.5.3.8v1.2a.9.9 0 0 1-.9.9H15z"/><path class="detail" d="M16.4 11.3h2l1.9 2.3h-3.9z"/><circle class="wheel" cx="8" cy="17.3" r="2.1"/><circle class="wheel" cx="18.4" cy="17.3" r="2.1"/><circle class="hub" cx="8" cy="17.3" r=".75"/><circle class="hub" cx="18.4" cy="17.3" r=".75"/><path class="accent" d="M1 10.4h2M1.6 13.4h1.4"/>',
    tag:   '<path class="body" d="M8.6 4.5h11.2a1.7 1.7 0 0 1 1.7 1.7v11.6a1.7 1.7 0 0 1-1.7 1.7H8.6L2.9 12.9a1.3 1.3 0 0 1 0-1.8z"/><circle class="hole" cx="6.3" cy="12" r=".95"/><text class="txt" x="14.4" y="15.3" text-anchor="middle">$5</text>',
    blank: '<circle class="body dim" cx="12" cy="12" r="8.5"/><path class="x" d="M9 9l6 6M15 9l-6 6"/>'
  };
  function sticker(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><g class="under">'+ICO[n]+'</g><g class="over">'+ICO[n]+'</g></svg>'; }
  var TILES = {
    '10%':  { pct:true, big:'10%', sub:'OFF' },
    'DEL':  { svg:sticker('van'),   lbl:'Free delivery', cls:'c-del' },
    'FIVE': { svg:sticker('tag'),   lbl:'$5 off',        cls:'c-five' },
    'CYL':  { img:'/cylinder-sticker.png', lbl:'Free cylinder', cls:'c-cyl' },
    'X':    { svg:sticker('blank'), lbl:'No prize' }
  };
  var CARDS = [
    { prize:'10% off', pool:['10%','10%','DEL','DEL','FIVE','FIVE','CYL','CYL','X'], win:null,
      big:'So close…', sm:'Four pairs, no triple. There’s another card.', after:'next' },
    { prize:'10% off', pool:['10%','10%','10%','DEL','DEL','FIVE','CYL','CYL','X'], win:'10%',
      big:'10% OFF', pink:true, sm:'Three of a kind. Yours to keep on any order.', after:'double' },
    { prize:'Free cylinder', pool:['CYL','CYL','X','DEL','DEL','FIVE','FIVE','10%','10%'], win:null,
      big:'No dice.', sm:'Two cylinders and a blank. Your 10% is still locked in.', after:'end' }
  ];
  var idx=0, cells=[], symbols=[], done=false, scratching=false, moved=0, touched=false;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function buildGrid(card){
    symbols = shuffle(card.pool);
    grid.innerHTML='';
    cells = symbols.map(function(s){
      var d=document.createElement('div'); d.className='cell'; var t=TILES[s];
      if (t.pct) { d.classList.add('pct','hue'); d.innerHTML='<span class="num">'+t.big+'<small>'+t.sub+'</small></span>'; }
      else { if (t.cls) d.classList.add(t.cls,'hue'); d.innerHTML='<span class="tile">'+(t.img?'<img src="'+t.img+'" alt="" draggable="false">':t.svg)+'<b>'+t.lbl+'</b></span>'; }
      grid.appendChild(d); return d;
    });
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  FOIL — three layers, all the same pixel size:
  //    base  : brushed platinum texture, painted once per layout (offscreen)
  //    mask  : opaque sheet the user scratches holes in (offscreen)
  //    foil  : what you see — base + live sheen + embossed logo, cut by mask
  //  The sheen and emboss light direction follow the card tilt, so the foil
  //  catches light as the phone moves; scratched areas simply aren't there.
  // ═══════════════════════════════════════════════════════════════════════════
  var fctx, dpr=1, W=0, H=0, foilLeft=0, foilTop=0;
  var base=document.createElement('canvas'), bctx;
  var mask=document.createElement('canvas'), mctx;
  var wordmark=new Image(), logo=null;   // logo = {w,h,x,y,dark,light,fill,line} tinted silhouettes
  wordmark.onload=function(){ if(W) buildLogo(); dirty=true; kick(); };
  wordmark.src='/wordmark.png';

  function seeded(n){var s=n;return function(){s=(s*9301+49297)%233280;return s/233280}}
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function clamp(v,a,b){return v<a?a:v>b?b:v}

  function layout(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = wrap.offsetWidth; H = wrap.offsetHeight;
    foilLeft = wrap.offsetLeft; foilTop = wrap.offsetTop;   // offsetParent = .card (position:relative)
    var pw=Math.round(W*dpr), ph=Math.round(H*dpr);
    foil.width=pw; foil.height=ph; base.width=pw; base.height=ph; mask.width=pw; mask.height=ph;
    fctx=foil.getContext('2d'); bctx=base.getContext('2d'); mctx=mask.getContext('2d');
    fctx.setTransform(dpr,0,0,dpr,0,0); bctx.setTransform(dpr,0,0,dpr,0,0); mctx.setTransform(dpr,0,0,dpr,0,0);
    paintBase();
    if (wordmark.complete && wordmark.naturalWidth) buildLogo();
  }

  // S1 — brushed platinum (static part: gradient, brushing, vignette, hairline borders)
  function paintBase(){
    var c=bctx; c.globalCompositeOperation='source-over'; c.clearRect(0,0,W,H);
    c.save(); rr(c,0,0,W,H,16); c.clip();
    var g=c.createLinearGradient(0,0,W,H*.6);
    g.addColorStop(0,'#d9dee3');g.addColorStop(.42,'#f0f2f4');g.addColorStop(.5,'#f6f7f9');g.addColorStop(.58,'#e6eaee');g.addColorStop(1,'#c9d0d6');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    var rnd=seeded(7);c.lineWidth=1;
    for(var y=0;y<H;y+=2){c.strokeStyle='rgba(255,255,255,'+(0.12+rnd()*0.25)+')';c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();
      if(rnd()<0.5){c.strokeStyle='rgba(60,70,80,'+(0.03+rnd()*0.08)+')';c.beginPath();c.moveTo(0,y+1);c.lineTo(W,y+1);c.stroke();}}
    var v=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,30,40,.16)');c.fillStyle=v;c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;rr(c,8.5,8.5,W-17,H-17,11);c.stroke();
    c.strokeStyle='rgba(40,50,60,.12)';rr(c,7.5,7.5,W-15,H-15,12);c.stroke();
    c.restore();
  }

  function resetMask(){
    mctx.globalCompositeOperation='source-over'; mctx.clearRect(0,0,W,H);
    mctx.fillStyle='#000'; mctx.fillRect(0,0,W,H);
    mctx.globalCompositeOperation='destination-out';
  }

  // Split the wordmark into its two blues (outline vs fill) and pre-tint four silhouettes.
  function buildLogo(){
    var lw=Math.round(W*.6), lh=Math.round(lw*wordmark.naturalHeight/wordmark.naturalWidth);
    var pw=lw*dpr, ph=lh*dpr;
    var src=document.createElement('canvas'); src.width=pw; src.height=ph;
    var sc=src.getContext('2d'); sc.drawImage(wordmark,0,0,pw,ph);
    var id=sc.getImageData(0,0,pw,ph), d=id.data, n=d.length;
    function tinted(pick,rgb,am){
      var out=sc.createImageData(pw,ph), o=out.data;
      for(var i=0;i<n;i+=4){ var a=d[i+3]; if(!a) continue; var line=d[i]<40&&d[i+1]<165; if(pick==='line'?!line:pick==='fill'?line:false) continue;
        o[i]=rgb[0];o[i+1]=rgb[1];o[i+2]=rgb[2];o[i+3]=Math.round(a*am); }
      var cv=document.createElement('canvas'); cv.width=pw; cv.height=ph; cv.getContext('2d').putImageData(out,0,0); return cv;
    }
    logo={ w:lw, h:lh, x:Math.round((W-lw)/2), y:Math.round(H/2-lh/2-9),
      dark:tinted('all',[30,40,52],.62), light:tinted('all',[255,255,255],.95),
      fill:tinted('fill',[70,84,98],.14), line:tinted('line',[40,52,66],.30) };
  }

  // lx,ly = where the light hits the foil (0..1). Everything moving lives here.
  function renderFoil(lx,ly){
    if(!fctx) return;
    var c=fctx; c.globalCompositeOperation='source-over'; c.clearRect(0,0,W,H);
    c.drawImage(base,0,0,W,H);
    c.save(); rr(c,0,0,W,H,16); c.clip();
    // anisotropic band: runs on the diagonal, slides with the light
    var t=clamp((lx*W+ly*H)/(W+H),0,1);
    var band=c.createLinearGradient(0,0,W,H);
    function stop(o,a){band.addColorStop(clamp(t+o,0,1),'rgba(255,255,255,'+a+')')}
    stop(-.20,0);stop(-.06,.42);stop(0,.78);stop(.06,.42);stop(.20,0);
    c.fillStyle=band;c.fillRect(0,0,W,H);
    // soft point glow where the light sits
    var glow=c.createRadialGradient(lx*W,ly*H,0,lx*W,ly*H,W*.6);
    glow.addColorStop(0,'rgba(255,255,255,.34)');glow.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=glow;c.fillRect(0,0,W,H);
    // light direction for the emboss (from the logo toward the light; top-left when centred)
    var Lx=(lx-.5)*2.8-.7, Ly=(ly-.5)*2.8-.7, Ln=Math.hypot(Lx,Ly)||1; Lx/=Ln; Ly/=Ln;
    var d=1.6;
    if(logo){
      c.drawImage(logo.dark, logo.x+Lx*d, logo.y+Ly*d, logo.w, logo.h);   // shadowed rim faces the light (pressed in)
      c.drawImage(logo.light,logo.x-Lx*d, logo.y-Ly*d, logo.w, logo.h);   // lit rim on the far side
      c.drawImage(logo.fill, logo.x, logo.y, logo.w, logo.h);
      c.drawImage(logo.line, logo.x, logo.y, logo.w, logo.h);
      embossText(c,'SCRATCH TO REVEAL',W/2,logo.y+logo.h+16,'600 10px Inter, sans-serif',Lx,Ly);
    } else {
      embossText(c,'ADELAIDE WHIP',W/2,H/2-8,'700 15px Inter, sans-serif',Lx,Ly);
      embossText(c,'SCRATCH TO REVEAL',W/2,H/2+13,'600 10px Inter, sans-serif',Lx,Ly);
    }
    c.restore();
    // cut out what's been scratched
    c.globalCompositeOperation='destination-in'; c.drawImage(mask,0,0,W,H);
    c.globalCompositeOperation='source-over';
  }
  function embossText(c,text,x,y,font,Lx,Ly){c.font=font;c.textAlign='center';c.textBaseline='middle';c.fillStyle='rgba(255,255,255,.9)';c.fillText(text,x-Lx,y-Ly);c.fillStyle='rgba(35,42,50,.5)';c.fillText(text,x,y)}

  // ═══════════════════════════════════════════════════════════════════════════
  //  TILT — the whole card (white border and all) leans in 3D.
  //    gyro  : phone orientation, relative to how it was first held
  //    hover : desktop pointer over the card (light press)
  //    press : while scratching, the card sinks under the finger
  //  Everything is summed, smoothed, and drives: card transform, moving shadow,
  //  a light/shade wash over the white card, and the foil sheen position.
  // ═══════════════════════════════════════════════════════════════════════════
  var P=900, MAXG=14, MAXH=10, MAXP=11, LIM=18;
  var tilt={a:0,b:0,s:1}, gyro={a:0,b:0}, hover={a:0,b:0}, press={a:0,b:0,s:1};
  var running=false, dirty=false, lastLx=-1, lastLy=-1, idleAmp=0, lastGyroAt=-1e9;
  function kick(){ if(!running){ running=true; requestAnimationFrame(frame); } }
  function frame(){
    // ambient float: the card rocks on its own until the gyro or a finger takes over
    var now=performance.now(), wantIdle=(!REDUCED && !scratching && now-lastGyroAt>1500)?1:0;
    idleAmp+=(wantIdle-idleAmp)*.04;
    var t=now/1000, ia=Math.sin(t*.85)*4.5*idleAmp, ib=Math.sin(t*.62+1.1)*6.5*idleAmp;
    var ta=clamp(gyro.a+hover.a+press.a+ia,-LIM,LIM), tb=clamp(gyro.b+hover.b+press.b+ib,-LIM,LIM), ts=press.s;
    tilt.a+=(ta-tilt.a)*.16; tilt.b+=(tb-tilt.b)*.16; tilt.s+=(ts-tilt.s)*.22;
    var settled=Math.abs(ta-tilt.a)<.02&&Math.abs(tb-tilt.b)<.02&&Math.abs(ts-tilt.s)<.001;
    if(settled){ tilt.a=ta; tilt.b=tb; tilt.s=ts; }
    // the highlight moves toward whichever side leans in toward you
    var lx=clamp(.5-(tilt.b/MAXG)*.42,.04,.96), ly=clamp(.5+(tilt.a/MAXG)*.42,.04,.96);
    applyCard(lx,ly);
    if(!done && (dirty || Math.abs(lx-lastLx)>.0015 || Math.abs(ly-lastLy)>.0015)){ renderFoil(lx,ly); lastLx=lx; lastLy=ly; }
    dirty=false;
    if(settled && idleAmp<.002) running=false; else requestAnimationFrame(frame);
  }
  function applyCard(lx,ly){
    card.style.transform='rotateX('+tilt.a.toFixed(3)+'deg) rotateY('+tilt.b.toFixed(3)+'deg) scale('+tilt.s.toFixed(4)+')';
    var sx=(-tilt.b*1.2).toFixed(1), sy=(18-tilt.a*1.1).toFixed(1);
    card.style.boxShadow=sx+'px '+sy+'px 50px rgba(26,143,191,.18), 0 1px 0 rgba(28,28,28,.08)';
    var Lx=(lx-.5)*2.8-.7, Ly=(ly-.5)*2.8-.7, ang=Math.atan2(-Lx,Ly)*180/Math.PI;
    shade.style.background='linear-gradient('+ang.toFixed(1)+'deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 46%, rgba(10,35,70,.075) 100%)';
  }

  // Screen point → point on the tilted card plane (exact inverse of perspective·rotateX·rotateY·scale).
  // Returns card-centred coords in CSS px plus normalised (-1..1) position for the press.
  function unproject(cx,cy){
    var r=stage.getBoundingClientRect();
    var sx=cx-(r.left+r.width/2), sy=cy-(r.top+r.height/2);
    var a=tilt.a*Math.PI/180, b=tilt.b*Math.PI/180, s=tilt.s||1;
    var ca=Math.cos(a), sa=Math.sin(a), cb=Math.cos(b), sb=Math.sin(b);
    var nx=sb, ny=-cb*sa, nz=cb*ca;                    // plane normal after Rx(a)·Ry(b)
    var den=P*nz-nx*sx-ny*sy; if(Math.abs(den)<1e-6) den=1e-6;
    var t=P*nz/den, qx=t*sx, qy=t*sy, qz=P*(1-t);      // ray from eye (0,0,P) hits the plane
    var y1=qy*ca+qz*sa, z1=-qy*sa+qz*ca, x1=qx;        // Rx(-a)
    var x2=x1*cb-z1*sb;                                // Ry(-b)
    return { x:x2/s, y:y1/s, nx:clamp(x2/s/(r.width/2),-1,1), ny:clamp(y1/s/(r.height/2),-1,1), hw:r.width/2, hh:r.height/2 };
  }
  function foilPos(e){ var u=unproject(e.clientX,e.clientY); return { x:u.x+u.hw-foilLeft, y:u.y+u.hh-foilTop, u:u }; }

  // gyro
  var base0=null;
  function onOri(e){
    if(e.beta==null||e.gamma==null) return;
    if(!base0){ base0={b:e.beta,g:e.gamma}; return; }
    var db=e.beta-base0.b, dg=e.gamma-base0.g;
    var ang=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
    var fx, fy;                                   // fx = forward/back lean, fy = left/right lean
    if(ang===90){ fx=dg; fy=-db; } else if(ang===-90||ang===270){ fx=-dg; fy=db; } else { fx=db; fy=dg; }
    gyro.a=clamp(-fx,-30,30)/30*MAXG;             // top of the phone away from you → top of the card away
    gyro.b=clamp(fy,-30,30)/30*MAXG;              // right edge down → right edge away
    lastGyroAt=performance.now();
    kick();
  }
  var tiltBtn=$('tiltBtn'), startBtn=$('start'), gyroOn=false, gyroAsked=false, gyroState='unsupported';
  var needsPerm=('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission==='function');
  function startGyro(){ if(gyroOn) return; gyroOn=true; gyroState='on'; window.addEventListener('deviceorientation',onOri); hide(tiltBtn); }
  function enableGyro(){
    if(REDUCED||gyroOn||gyroAsked||!('DeviceOrientationEvent' in window)) return;
    if(needsPerm){
      gyroAsked=true;
      DeviceOrientationEvent.requestPermission().then(function(st){
        if(st==='granted') startGyro();
        else { gyroState='denied'; show(tiltBtn); tiltBtn.textContent='Tilt is blocked — allow Motion & Orientation for Safari in Settings, then reload'; }
      }).catch(function(){ gyroState='needs tap'; show(tiltBtn); });
    } else startGyro();
  }
  if('DeviceOrientationEvent' in window) gyroState = REDUCED ? 'off (Reduce Motion)' : needsPerm ? 'needs tap' : 'on';
  if(needsPerm){
    // iPhone: motion AND sound only unlock on a tap release, so the first card gets a "Tap to start" pill.
    // Any tap anywhere does the same job (the pill is the invitation, not a gate).
    show(startBtn);
    var ask=function(){ enableGyro(); hide(startBtn); };
    document.addEventListener('touchend',ask,{capture:true,passive:true}); document.addEventListener('click',ask,true);
    startBtn.addEventListener('click',function(){ audioInit(); enableGyro(); hide(startBtn); });
    tiltBtn.addEventListener('click',function(){ gyroAsked=false; enableGyro(); });
  } else enableGyro();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') base0=null; });

  // hover (desktop only — a light press that follows the pointer)
  if(CAN_HOVER){
    window.addEventListener('pointermove',function(e){ if(scratching||e.pointerType==='touch') return; var u=unproject(e.clientX,e.clientY); hover.b=u.nx*MAXH; hover.a=-u.ny*MAXH; kick(); });
    document.documentElement.addEventListener('mouseleave',function(){ hover.a=0; hover.b=0; kick(); });
  }

  function loadCard(i){
    idx=i; done=false; touched=false; var cardDef=CARDS[i];
    step.textContent='Card '+(i+1)+' of 3'; prize.textContent=cardDef.prize;
    result.innerHTML='<div class="sm">Use a finger or your mouse.</div>';
    hide(B.next,B.dbl,B.keep,B.codeBox,B.shop,B.fine,B.revealAll);
    buildGrid(cardDef);
    requestAnimationFrame(function(){ layout(); resetMask(); foil.classList.remove('gone'); lastLx=-1; dirty=true; kick(); });
  }

  // bring the buttons into view (first scratch, and whenever a card is read) — scratch positions are
  // re-read from the live layout on every event, so the page can move under the finger safely
  var actions=$('actions');
  function showButtons(){ requestAnimationFrame(function(){ var b=actions.getBoundingClientRect().bottom+24; if(b>innerHeight) window.scrollBy({top:b-innerHeight,left:0,behavior:'smooth'}); }); }
  function erase(p){ mctx.beginPath(); mctx.arc(p.x,p.y,18,0,Math.PI*2); mctx.fill(); dirty=true; }

  // One sheet: once ~55% of the foil is gone, the rest lifts off and the card is read.
  function check(){
    if(done) return;
    var img=mctx.getImageData(0,0,mask.width,mask.height).data, n=0, clear=0;
    for(var i=3;i<img.length;i+=4*13){ n++; if(img[i]===0) clear++; }
    if(clear/n > 0.55) evaluate();
  }

  function revealAll(){
    if(done) return;
    scratchQuiet(); mctx.clearRect(0,0,W,H); dirty=true;
    evaluate();
  }

  function evaluate(){
    done=true; press.a=0; press.b=0; press.s=1; scratching=false;
    renderFoil(lastLx<0?.5:lastLx, lastLy<0?.5:lastLy); foil.classList.add('gone'); hide(B.revealAll); kick();
    var cardDef=CARDS[idx], counts={};
    symbols.forEach(function(s){counts[s]=(counts[s]||0)+1});
    var winner=null; Object.keys(counts).forEach(function(k){ if(counts[k]>=3) winner=k; });
    if(winner){ cells.forEach(function(c,i){ if(symbols[i]===winner) c.classList.add('win'); }); }
    else { grid.classList.add('shake'); setTimeout(function(){grid.classList.remove('shake')},400); }
    result.innerHTML='<div class="big'+(cardDef.pink?' pink':'')+' pop">'+cardDef.big+'</div><div class="sm">'+cardDef.sm+'</div>';
    if(cardDef.after==='next'){ show(B.next); }
    else if(cardDef.after==='double'){ lede.textContent='Feeling lucky? Double down… or bank the 10%.'; show(B.dbl,B.keep); }
    else finish();
    showButtons();
  }

  function finish(){
    step.textContent='Done'; lede.textContent='Your code works on anything in the store.';
    B.codeText.textContent=CODE; B.shop.href=SHOP;
    B.fine.textContent='Confession: everyone wins the 10% — we just wanted to see you scratch. One use per customer'+(EXP?', valid until '+EXP:'')+'.';
    show(B.codeBox,B.shop,B.fine); hide(B.dbl,B.keep,B.next,B.revealAll); showButtons();
  }

  // ── scratch sound: two layers of filtered noise, synthesised on the fly (no audio files).
  //    The hiss follows how fast the finger moves; random short grains on top give the coin-on-latex crackle.
  var AC=null, hiss=null, hissFilter=null, crackle=null, sndP=null, sndT=0;
  function audioInit(){
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    try{ AC=new Ctx(); }catch(_){ return; }
    var len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    function layer(hpHz,bpHz,q){
      var src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
      var hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=hpHz;
      var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=bpHz; bp.Q.value=q;
      var g=AC.createGain(); g.gain.value=0;
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(AC.destination); src.start();
      return {gain:g.gain, filter:bp.frequency};
    }
    var a=layer(900,2600,.9), b=layer(2500,5200,1.2);
    hiss=a.gain; hissFilter=a.filter; crackle=b.gain;
    if(AC.state==='suspended') AC.resume();
  }
  function scratchSound(p){
    if(!AC||!hiss) return;
    var now=performance.now(), t=AC.currentTime;
    if(sndP){
      var v=Math.hypot(p.x-sndP.x,p.y-sndP.y)/Math.max(8,now-sndT);   // px per ms
      var g=Math.min(.22,v*.4);
      hiss.cancelScheduledValues(t); hiss.setTargetAtTime(g,t,.012); hiss.setTargetAtTime(0,t+.07,.05);   // fades if the finger stops
      hissFilter.setTargetAtTime(1800+Math.min(3000,v*2500),t,.03);
      if(Math.random()<Math.min(.7,.15+v*.7)){ crackle.cancelScheduledValues(t); crackle.setValueAtTime(Math.min(.16,.05+v*.14),t); crackle.exponentialRampToValueAtTime(.001,t+.025+Math.random()*.04); }
    }
    sndP=p; sndT=now;
  }
  function scratchQuiet(){ sndP=null; if(AC&&hiss){ var t=AC.currentTime; hiss.cancelScheduledValues(t); hiss.setTargetAtTime(0,t,.04); } }
  // browsers only let audio start after a tap — the first scratch (or its release) unlocks it
  ['touchend','click'].forEach(function(ev){ document.addEventListener(ev,function(){ audioInit(); },{capture:true,passive:true}); });

  // scratching — the card sinks toward the finger while you scratch, springs back when you lift
  function pressAt(u){ press.b=u.nx*MAXP; press.a=-u.ny*MAXP; press.s=.985; hover.a=0; hover.b=0; }
  function release(){ press.a=0; press.b=0; press.s=1; kick(); }
  foil.addEventListener('pointerdown',function(e){ if(done) return; scratching=true; try{foil.setPointerCapture(e.pointerId)}catch(_){} audioInit(); var p=foilPos(e); pressAt(p.u); erase(p); scratchSound(p); kick(); if(!touched){touched=true; show(B.revealAll); result.innerHTML='<div class="sm">Keep scratching…</div>'; showButtons();} });
  foil.addEventListener('pointermove',function(e){ if(!scratching) return; var p=foilPos(e); pressAt(p.u); erase(p); scratchSound(p); kick(); if(++moved%5===0) check(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ foil.addEventListener(ev,function(){ if(scratching){ scratching=false; release(); scratchQuiet(); check(); } }); });

  B.revealAll.addEventListener('click',revealAll);
  B.next.addEventListener('click',function(){ lede.textContent='Scratch the panels. Match three the same to win.'; loadCard(1); });
  B.dbl.addEventListener('click',function(){ lede.textContent='Brave. Match three cylinders.'; loadCard(2); });
  B.keep.addEventListener('click',function(){ finish(); });
  B.copy.addEventListener('click',function(){ var ok=function(){B.copy.textContent='Copied ✓';setTimeout(function(){B.copy.textContent='Copy'},1400)}; if(navigator.clipboard){navigator.clipboard.writeText(CODE).then(ok,ok)}else{ok()} });
  var lastW=0;
  window.addEventListener('resize',function(){ var w=wrap.offsetWidth; if(w===lastW) return; lastW=w; if(!done){ layout(); resetMask(); lastLx=-1; dirty=true; kick(); } });

  // ?debug=1 → a readout of what this phone reports, for troubleshooting from a screenshot
  if(q.get('debug')){ var dbg=$('dbg'); show(dbg); setInterval(function(){
    dbg.textContent='reduce-motion: '+(REDUCED?'ON':'off')+' · gyro: '+gyroState+' · sound: '+(AC?AC.state:'not started')+' · tilt '+tilt.a.toFixed(1)+'/'+tilt.b.toFixed(1)+' · '+(gyroOn?'gyro events: '+(performance.now()-lastGyroAt<1500?'live':'none'):'')+' · '+navigator.userAgent.replace(/^.*\((.*?)\).*$/,'$1').slice(0,40);
  },500); }
  // test hooks (harmless): window.__scratch.revealAll(), .tilt(a,b), .scratchAt(x,y)
  window.__scratch = { revealAll: revealAll, tilt:function(a,b){ gyro.a=a; gyro.b=b; kick(); }, scratchAt:function(x,y){ erase({x:x,y:y}); kick(); } };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ lastW=wrap.offsetWidth; loadCard(0); });
})();
</script>
</body>
