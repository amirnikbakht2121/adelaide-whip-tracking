<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your scratchie · Adelaide Whip</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="https://www.adelaidewhip.com/cdn/shop/files/strawberry660white.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--cream:#FAF6EC;--sky-soft:#E8F4FA;--sky-mid:#D5EAF5;--ink:#1C1C1C;--ink-soft:#4A4744;--warm-grey:#8C857C;--blue:#1A8FBF;--pink:#E07594;--yellow:#FFD166;--cyan:#2BC0FF;--line:rgba(28,28,28,.08)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky-soft) 0%,var(--sky-mid) 35%,var(--cream) 100%) fixed;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:26px 18px 48px}
  .logo{height:54px;width:auto;margin:4px 0 16px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(28px,7vw,36px);line-height:1.08;margin:0 0 8px;text-align:center;letter-spacing:-.01em;text-wrap:balance}
  .lede{margin:0 0 18px;color:var(--ink-soft);font-size:15px;text-align:center;max-width:36ch;min-height:1.4em}
  .step{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);text-align:center;margin:0 0 10px}
  .card{position:relative;width:min(340px,100%);border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(26,143,191,.16),0 1px 0 var(--line);padding:12px;user-select:none;-webkit-user-select:none}
  .rule{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warm-grey)}
  .rule b{color:var(--pink)}
  .gridwrap{position:relative;touch-action:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cell{aspect-ratio:1;border-radius:12px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;font-size:32px;padding:4px;line-height:1;position:relative;transition:box-shadow .25s,background .25s}
  .cell .pct{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;letter-spacing:-.01em;color:#fff;background:var(--pink);padding:6px 9px;border-radius:10px}
  .cell .pct.blue{background:var(--blue)}
  .cell .pct small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.12em;text-align:center;margin-top:1px;opacity:.9}
  .cell .tile{display:flex;flex-direction:column;align-items:center;gap:3px}
  .cell .tile em{font-style:normal;font-size:24px;line-height:1}
  .cell .tile img{height:40px;width:auto;display:block;filter:drop-shadow(0 2px 3px rgba(28,28,28,.18))}
  .cell .tile b{font:700 9.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.15}
  .cell.win{background:#FFF1F5;box-shadow:0 0 0 3px var(--pink) inset}
  .cell.win .pct{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
  .cell.win.blue{background:var(--sky-soft);box-shadow:0 0 0 3px var(--blue) inset}
  canvas.foil{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.foil.gone{pointer-events:none;opacity:0;transition:opacity .35s}
  .result{margin:12px 0 0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
  .result .big{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26px;line-height:1.1}
  .result .big.pink{color:var(--pink);font-size:30px}
  .result .sm{color:var(--ink-soft);font-size:13.5px;max-width:30ch}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:min(340px,100%)}
  .btn{appearance:none;border:0;border-radius:14px;height:50px;font:600 15px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s ease,background .2s}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#177fa9}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 6px 18px rgba(28,28,28,.06)}
  .btn.pink{background:var(--pink);color:#fff}
  .btn.small{height:40px;font-size:13.5px}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .hidden{display:none!important}
  .code{margin-top:2px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(28,28,28,.06)}
  .code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.14em}
  .code button{appearance:none;border:0;background:var(--sky-soft);color:var(--blue);font:600 13px Inter,sans-serif;border-radius:10px;padding:9px 12px;cursor:pointer}
  .fine{margin:16px 0 0;font-size:12px;color:var(--warm-grey);text-align:center;max-width:40ch;line-height:1.45}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .pop{animation:pop .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .shake{animation:shake .35s ease-in-out}
  @media (prefers-reduced-motion:reduce){.pop,.shake,.cell.win .pct{animation:none}canvas.foil.gone{transition:none}}
</style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="Adelaide Whip">
  <h1 id="title">Your scratchie's here.</h1>
  <p class="lede" id="lede">Scratch the panels. Match three the same to win.</p>

  <p class="step" id="step">Card 1 of 3</p>
  <div class="card" id="card">
    <div class="rule"><span>Match 3</span><span>Win <b id="prize">10% off</b></span></div>
    <div class="gridwrap" id="gridwrap">
      <div class="grid" id="grid"></div>
      <canvas class="foil" id="foil" aria-label="Scratch the panels" role="img"></canvas>
    </div>
    <div class="result" id="result"><div class="sm">Use a finger or your mouse.</div></div>
  </div>

  <div class="actions">
    <button class="btn ghost small hidden" id="revealAll">Reveal the rest</button>
    <button class="btn primary hidden" id="next">Next card</button>
    <button class="btn pink hidden" id="double">Double down for 20%</button>
    <button class="btn ghost hidden" id="keep">I'll keep my 10%</button>
    <div class="code hidden" id="codeBox"><b id="codeText">SCRATCH10</b><button id="copy">Copy</button></div>
    <a class="btn primary hidden" id="shop" href="#">Shop with 10% off</a>
  </div>
  <p class="fine hidden" id="fine"></p>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var CODE = (q.get('code') || 'SCRATCH10').toUpperCase().replace(/[^A-Z0-9]/g,'');
  var EXP  = q.get('exp') || '';
  var NAME = (q.get('n') || '').replace(/[^A-Za-z' -]/g,'').trim();
  var SHOP = 'https://www.adelaidewhip.com/discount/' + encodeURIComponent(CODE) + '?redirect=%2Fcollections%2Fall';
  if (NAME) document.getElementById('title').textContent = NAME + ', your scratchie’s here.';

  var $ = function(id){return document.getElementById(id)};
  var grid=$('grid'), wrap=$('gridwrap'), foil=$('foil'), result=$('result'), step=$('step'), lede=$('lede'), prize=$('prize');
  var B={revealAll:$('revealAll'),next:$('next'),dbl:$('double'),keep:$('keep'),codeBox:$('codeBox'),codeText:$('codeText'),copy:$('copy'),shop:$('shop'),fine:$('fine')};
  function show(){for(var i=0;i<arguments.length;i++)arguments[i].classList.remove('hidden')}
  function hide(){for(var i=0;i<arguments.length;i++)arguments[i].classList.add('hidden')}

  // ── Scripted cards. Symbol POSITIONS are shuffled per visit; the OUTCOME is fixed
  //    (no three-of-a-kind → three 10% → two 20% and a miss). The last screen says so.
  // Prize tiles a real card would show. Only 10% ever completes a triple.
  var TILES = {
    '10%':  { big:'10%',  sub:'OFF',           cls:'pct' },
    '20%':  { big:'20%',  sub:'OFF',           cls:'pct blue' },
    'DEL':  { img:'https://www.adelaidewhip.com/cdn/shop/files/strawberry660white.png', lbl:'Free small cylinder' },
    '660':  { ico:'🎈',   lbl:'Free balloons' },
    'FIVE': { ico:'💵',   lbl:'$5 off' },
    'NOZ':  { ico:'🍓',   lbl:'Free nozzles' },
    'ICE':  { ico:'🧊',   lbl:'No prize' }
  };
  var CARDS = [
    { prize:'10% off', pool:['DEL','DEL','660','660','FIVE','FIVE','20%','10%','ICE'], win:null,
      big:'So close…', sm:'Three pairs, no triple. There’s another card.', after:'next' },
    { prize:'10% off', pool:['10%','10%','10%','DEL','DEL','FIVE','660','20%','ICE'], win:'10%',
      big:'10% OFF', pink:true, sm:'Three of a kind. Yours to keep on any order.', after:'double' },
    { prize:'20% off', pool:['20%','20%','ICE','DEL','DEL','660','660','FIVE','10%'], win:null,
      big:'No dice.', sm:'Two 20s and an ice cube. Your 10% is still locked in.', after:'end' }
  ];
  var idx=0, cells=[], symbols=[], revealedCells=[], ctx, dpr=1, W=0, H=0, cellRects=[], done=false, scratching=false, moved=0, touched=false;

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function buildGrid(card){
    symbols = shuffle(card.pool);
    grid.innerHTML='';
    cells = symbols.map(function(s){
      var d=document.createElement('div'); d.className='cell'; var t=TILES[s];
      if (t.cls) { var p=document.createElement('span'); p.className=t.cls; p.innerHTML=t.big+'<small>'+t.sub+'</small>'; d.appendChild(p); }
      else d.innerHTML='<span class="tile">'+(t.img?'<img src="'+t.img+'" alt="" draggable="false">':'<em>'+t.ico+'</em>')+'<b>'+t.lbl+'</b></span>';
      grid.appendChild(d); return d;
    });
    revealedCells = symbols.map(function(){return false});
  }

  function layout(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    var r = wrap.getBoundingClientRect(); W=r.width; H=r.height;
    foil.width=Math.round(W*dpr); foil.height=Math.round(H*dpr);
    ctx = foil.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    cellRects = cells.map(function(c){var cr=c.getBoundingClientRect();return {x:cr.left-r.left,y:cr.top-r.top,w:cr.width,h:cr.height}});
  }

  function rrect(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath()}
  function paintFoil(){
    ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,W,H);
    cellRects.forEach(function(c,i){
      if (revealedCells[i]) return;
      ctx.save(); rrect(c.x,c.y,c.w,c.h,12); ctx.clip();
      var g=ctx.createLinearGradient(c.x,c.y,c.x+c.w,c.y+c.h);
      g.addColorStop(0,'#cfd6dc');g.addColorStop(.35,'#eef1f4');g.addColorStop(.55,'#b9c2ca');g.addColorStop(.8,'#e6eaee');g.addColorStop(1,'#c3cbd2');
      ctx.fillStyle=g; ctx.fillRect(c.x,c.y,c.w,c.h);
      ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
      for(var y=c.y+5;y<c.y+c.h;y+=8){ctx.beginPath();ctx.moveTo(c.x,y);ctx.lineTo(c.x+c.w,y+2);ctx.stroke()}
      ctx.fillStyle='rgba(28,28,28,.35)'; ctx.font='700 11px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('?', c.x+c.w/2, c.y+c.h/2);
      ctx.restore();
    });
    ctx.globalCompositeOperation='destination-out';
    foil.classList.remove('gone');
  }

  function loadCard(i){
    idx=i; done=false; touched=false; var card=CARDS[i];
    step.textContent='Card '+(i+1)+' of 3'; prize.textContent=card.prize;
    result.innerHTML='<div class="sm">Use a finger or your mouse.</div>';
    hide(B.next,B.dbl,B.keep,B.codeBox,B.shop,B.fine,B.revealAll);
    buildGrid(card);
    requestAnimationFrame(function(){ layout(); paintFoil(); });
  }

  function pos(e){var r=foil.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function erase(p){ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);ctx.fill()}

  // Per-cell clear ratio; a cell counts as revealed past ~45%, then we wipe it clean.
  function check(){
    if(done) return;
    var img=ctx.getImageData(0,0,foil.width,foil.height).data, rowW=foil.width*4, newly=false;
    cellRects.forEach(function(c,i){
      if(revealedCells[i]) return;
      var x0=Math.round(c.x*dpr), y0=Math.round(c.y*dpr), x1=Math.round((c.x+c.w)*dpr), y1=Math.round((c.y+c.h)*dpr), n=0, clear=0;
      for(var y=y0+3;y<y1;y+=7){ for(var x=x0+3;x<x1;x+=7){ n++; if(img[y*rowW+x*4+3]===0) clear++; } }
      if(n && clear/n>0.45){ revealedCells[i]=true; ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.fillRect(c.x-2,c.y-2,c.w+4,c.h+4); ctx.restore(); newly=true; }
    });
    if(newly && revealedCells.every(Boolean)) evaluate();
  }

  function revealAll(){
    if(done) return;
    revealedCells = revealedCells.map(function(){return true});
    ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.fillRect(0,0,W,H); ctx.restore();
    evaluate();
  }

  function evaluate(){
    done=true; foil.classList.add('gone'); hide(B.revealAll);
    var card=CARDS[idx], counts={};
    symbols.forEach(function(s){counts[s]=(counts[s]||0)+1});
    var winner=null; Object.keys(counts).forEach(function(k){ if(counts[k]>=3) winner=k; });
    if(winner){ cells.forEach(function(c,i){ if(symbols[i]===winner){ c.classList.add('win'); if(winner==='20%') c.classList.add('blue'); } }); }
    else { grid.classList.add('shake'); setTimeout(function(){grid.classList.remove('shake')},400); }
    result.innerHTML='<div class="big'+(card.pink?' pink':'')+' pop">'+card.big+'</div><div class="sm">'+card.sm+'</div>';
    if(card.after==='next'){ show(B.next); }
    else if(card.after==='double'){ lede.textContent='Feeling lucky? Go again for 20%… or bank the 10%.'; show(B.dbl,B.keep); }
    else finish();
  }

  function finish(){
    step.textContent='Done'; lede.textContent='Your code works on anything in the store.';
    B.codeText.textContent=CODE; B.shop.href=SHOP;
    B.fine.textContent='Confession: everyone wins the 10% — we just wanted to see you scratch. One use per customer'+(EXP?', valid until '+EXP:'')+'.';
    show(B.codeBox,B.shop,B.fine); hide(B.dbl,B.keep,B.next,B.revealAll);
  }

  foil.addEventListener('pointerdown',function(e){ if(done) return; scratching=true; foil.setPointerCapture(e.pointerId); erase(pos(e)); if(!touched){touched=true; show(B.revealAll); result.innerHTML='<div class="sm">Keep going — all nine panels.</div>';} });
  foil.addEventListener('pointermove',function(e){ if(!scratching) return; erase(pos(e)); if(++moved%5===0) check(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ foil.addEventListener(ev,function(){ if(scratching){ scratching=false; check(); } }); });

  B.revealAll.addEventListener('click',revealAll);
  B.next.addEventListener('click',function(){ lede.textContent='Scratch the panels. Match three the same to win.'; loadCard(1); });
  B.dbl.addEventListener('click',function(){ lede.textContent='Brave. Match three 20s.'; loadCard(2); });
  B.keep.addEventListener('click',function(){ finish(); });
  B.copy.addEventListener('click',function(){ var ok=function(){B.copy.textContent='Copied ✓';setTimeout(function(){B.copy.textContent='Copy'},1400)}; if(navigator.clipboard){navigator.clipboard.writeText(CODE).then(ok,ok)}else{ok()} });
  window.addEventListener('resize',function(){ if(!done){ layout(); paintFoil(); } });

  // test hook (harmless): window.__scratch.revealAll()
  window.__scratch = { revealAll: revealAll };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ loadCard(0); });
})();
</script>
</body>
</html>
